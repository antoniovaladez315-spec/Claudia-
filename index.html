
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Claudia ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #171326, #342044);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.contenedor {
  width: 90%;
  max-width: 420px;
  padding: 30px 20px;
}

h1 {
  font-size: 29px;
  line-height: 1.4;
}

p {
  font-size: 18px;
  line-height: 1.7;
  color: #e2d6ee;
}

button {
  background: #c7a4ff;
  color: #20132e;
  border: none;
  padding: 15px 28px;
  border-radius: 30px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 25px;
}

button:active {
  transform: scale(0.95);
}

.animacion {
  animation: aparecer 0.6s ease;
}

@keyframes aparecer {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.corazon {
  font-size: 45px;
  margin-bottom: 20px;
}
</style>
</head>

<body>

<div class="contenedor">
  <div id="contenido" class="animacion">
    <div class="corazon">💌</div>
    <h1 id="titulo">Oye, Claudia... 👀</h1>
    <p id="texto">
      Tengo algo que decirte, pero necesito
      que presiones ese botón.
    </p>
  </div>

  <button id="boton" onclick="siguiente()">
    ¿Qué pasó? 👀
  </button>
</div>

<script>
const mensajes = [
  {
    titulo: "Oye, Claudia... 👀",
    texto: "Tengo algo que decirte, pero necesito que presiones ese botón.",
    boton: "¿Qué pasó? 👀",
    emoji: "💌"
  },
  {
    titulo: "Primero que nada...",
    texto: "Prométeme que no te vas a reír de lo que voy a decirte 😂",
    boton: "Lo prometo 🤞",
    emoji: "🤨"
  },
  {
    titulo: "Bueno...",
    texto: "La verdad es que no sabía cómo decirte esto, así que hice una página web. Sí, así de dramático soy JAJAJA.",
    boton: "Ya dimeee 🙄",
    emoji: "😂"
  },
  {
    titulo: "Ahora sí ❤️",
    texto: "Quería decirte que eres una persona muy especial para mí y que me encanta poder compartir momentos contigo.",
    boton: "Continúa... 🥹",
    emoji: "❤️"
  },
  {
    titulo: "Y una última cosa...",
    texto: "No olvides lo mucho que vales y lo bonita que es tu forma de ser. Espero haberte sacado una sonrisa.",
    boton: "¿Otra vez? 💕",
    emoji: "✨"
  }
];

let indice = 0;

function siguiente() {
  indice++;

  if (indice >= mensajes.length) {
    indice = 0;
  }

  const mensaje = mensajes[indice];
  const contenido = document.getElementById("contenido");

  contenido.classList.remove("animacion");
  void contenido.offsetWidth;
  contenido.classList.add("animacion");

  document.getElementById("titulo").textContent =
    mensaje.titulo;

  document.getElementById("texto").textContent =
    mensaje.texto;

  document.getElementById("boton").textContent =
    mensaje.boton;

  document.querySelector(".corazon").textContent =
    mensaje.emoji;
}
</script>

</body>
</html>
